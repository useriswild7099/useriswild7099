<svg width="100%" height="100%" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple Dark Ambient Mesh Gradient -->
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="60%" stop-color="#0d0e12" />
      <stop offset="100%" stop-color="#14151b" />
    </linearGradient>

    <!-- Ultra-subtle Keynote Spotlight / Glow -->
    <radialGradient id="keynoteGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Border Stroke -->
    <linearGradient id="appleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>

    <!-- Text Gradient for Headline -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1A6" />
    </linearGradient>
  </defs>

  <!-- Container Box with Apple 20px Corner Radius -->
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#appleBg)" stroke="url(#appleBorder)" stroke-width="1" />
  
  <!-- Subtle Keynote Top Light Reflection -->
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#keynoteGlow)" />

  <!-- Content Container -->
  <g transform="translate(64, 48)">
    
    <!-- Overline: Name & Brand -->
    <text x="0" y="20" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="3.5">
      PRINCE TIGGA
    </text>

    <!-- Main Headline -->
    <text x="0" y="74" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.2">
      Engineering intelligence. Grounded in hardware.
    </text>

    <!-- Subtitle -->
    <text x="0" y="114" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="-0.2">
      Building edge AI systems, fine-tuning LLMs, and architecting resilient hardware-software platforms.
    </text>

    <!-- Bottom Metadata Badges (Isolated Groups with Accurate Offsets) -->
    <g transform="translate(0, 152)">
      
      <!-- Pill 1: Founder -->
      <g transform="translate(0, 0)">
        <rect width="210" height="32" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#30d158" />
        <text x="28" y="16" dominant-baseline="central" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.2">Founder, Artificial Studio</text>
      </g>

      <!-- Pill 2: Hackathon Winner -->
      <g transform="translate(222, 0)">
        <rect width="185" height="32" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="18" y="16" dominant-baseline="central" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.2">Neural x Winner (TU)</text>
      </g>

      <!-- Pill 3: ECE Tezpur University -->
      <g transform="translate(419, 0)">
        <rect width="205" height="32" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <text x="18" y="16" dominant-baseline="central" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.2">B.Tech ECE • Tezpur Univ</text>
      </g>

    </g>
  </g>

  <!-- Abstract Lens Graphic (Right Side) -->
  <g transform="translate(1040, 140)" opacity="0.2">
    <circle cx="0" cy="0" r="75" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 4" />
    <circle cx="0" cy="0" r="50" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="0" cy="0" r="25" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>
