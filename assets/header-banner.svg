<svg width="100%" height="100%" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple Dark Ambient Mesh Gradient -->
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="60%" stop-color="#0d0e12" />
      <stop offset="100%" stop-color="#14151b" />
    </linearGradient>

    <!-- Ultra-subtle Keynote Spotlight / Glow -->
    <radialGradient id="keynoteGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Border Stroke -->
    <linearGradient id="appleBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>

    <!-- Text Gradient for Headline -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1A6" />
    </linearGradient>
  </defs>

  <!-- Container Box with Apple 20px Corner Radius -->
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#appleBg)" stroke="url(#appleBorder)" stroke-width="1" />
  
  <!-- Subtle Keynote Top Light Reflection -->
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="url(#keynoteGlow)" />

  <!-- Content Container (Left Aligned, Apple Keynote Layout) -->
  <g transform="translate(64, 52)">
    
    <!-- Overline: Name & Brand -->
    <text x="0" y="24" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="3.5">
      PRINCE TIGGA
    </text>

    <!-- Main Headline -->
    <text x="0" y="78" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">
      Engineering intelligence. Grounded in hardware.
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="17" font-weight="400" letter-spacing="-0.2">
      Building edge AI systems, fine-tuning LLMs, and architecting resilient hardware-software platforms.
    </text>

    <!-- Refined Minimalist Status & Highlights (Bottom Row) -->
    <g transform="translate(0, 150)">
      <!-- Pill 1: Founder -->
      <rect x="0" y="0" width="190" height="30" rx="15" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="15" cy="15" r="3.5" fill="#30d158" />
      <text x="26" y="19" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.2">Founder, Artificial Studio</text>

      <!-- Pill 2: Hackathon Winner -->
      <rect x="202" y="0" width="180" height="30" rx="15" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="14" y="19" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.2">Neural x Winner (TU)</text>

      <!-- Pill 3: ECE Tezpur University -->
      <rect x="394" y="0" width="190" height="30" rx="15" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="14" y="19" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.2">B.Tech ECE • Tezpur Univ</text>
    </g>
  </g>

  <!-- Apple-Style Abstract Lens / Focus Graphic (Right Side) -->
  <g transform="translate(1030, 140)" opacity="0.25">
    <circle cx="0" cy="0" r="75" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 4" />
    <circle cx="0" cy="0" r="50" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="0" cy="0" r="25" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
</svg>
